services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APIKEY: ${APIKEY:-changeme}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smtudiary}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smtudiary}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smtudiary}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smtudiary}
      POSTGRES_USER: ${POSTGRES_USER:-smtudiary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smtudiary}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
